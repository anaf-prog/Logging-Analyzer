<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Log Error</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="/css/dashboard.css">
    <link rel="stylesheet" href="/css/dashboard-modal-delete.css">
</head>

<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">Log Error Monitor</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link active" aria-current="page" href="/dashboard">Dashboard</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/ssh-configs">Konfigurasi SSH</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container-fluid">
        <h1 class="mb-4 text-center">Log Error Dashboard</h1>

        <!-- Notifikasi Global -->
        <div id="globalNotification" style="position: fixed; top: 20px; right: 20px; z-index: 9999; min-width: 250px;"></div>

        <div class="row">
            <!-- Include Tabel Konfigurasi Monitor Produk -->
            <div th:replace="~{fragments/dashboard-konfigurasi-monitor-produk :: body}"></div>

            <!-- Include Tabel Daftar Monitor Produk -->
            <div th:replace="~{fragments/dashboard-daftar-monitor-produk :: body}"></div>

            <!-- Include Tabel Log Error -->
            <div th:replace="~{fragments/dashboard-log-error :: body}"></div>

        </div>

        <!-- Modal Konfirmasi Hapus -->
        <div th:replace="~{fragments/dashboard-modal-delete :: deleteModal}"></div>

    </div>

    <!-- Bootstrap Bundle with Popper -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>

    <!-- Pass data from server to JavaScript -->
    <script th:inline="javascript">
        /*<![CDATA[*/
        window.serverLatestErrors = /*[[${latestErrors}]]*/[];
        window.serverMonitorConfigs = /*[[${monitorConfigs}]]*/[];
        console.log('Data from server:', window.serverLatestErrors);
        /*]]>*/
    </script>

    <!-- Custom JavaScript -->
    <script src="/js/dashboard-notification.js?v=2" defer></script>
    <script src="/js/dashboard-filter.js?v=2" defer></script>
    <script src="/js/dashboard-pagination.js?v=2" defer></script>
    <script src="/js/dashboard.js?v=2" defer></script>
    <script src="/js/dashboard-monitor.js?v=2" defer></script>
    <script src="/js/dynamic-form.js?v=2" defer></script>
</body>

</html>
