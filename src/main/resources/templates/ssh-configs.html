<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Konfigurasi SSH</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
</head>

<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="/dashboard">Log Error Monitor</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link" href="/dashboard">Dashboard</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" aria-current="page" href="/ssh-configs">Konfigurasi SSH</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/monitor-configs">Konfigurasi Monitor</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container py-4">
        <h1 class="h3 mb-3">Tabel Konfigurasi SSH</h1>

        <div class="card mb-4">
            <div class="card-header">Form Konfigurasi SSH</div>
            <div class="card-body">
                <form id="sshConfigForm" class="row g-3">
                    <input type="hidden" id="sshConfigId" name="sshConfigId">

                    <div class="col-md-4">
                        <label for="name" class="form-label">Nama Config</label>
                        <input type="text" class="form-control" id="name" name="name" required>
                    </div>
                    <div class="col-md-4">
                        <label for="host" class="form-label">Host SSH</label>
                        <input type="text" class="form-control" id="host" name="host" required>
                    </div>
                    <div class="col-md-4">
                        <label for="port" class="form-label">Port SSH</label>
                        <input type="number" class="form-control" id="port" name="port" min="1" max="65535" value="22"
                            required>
                    </div>

                    <div class="col-md-4">
                        <label for="username" class="form-label">Username SSH</label>
                        <input type="text" class="form-control" id="username" name="username" required>
                    </div>
                    <div class="col-md-4">
                        <label for="password" class="form-label">Password SSH</label>
                        <input type="password" class="form-control" id="password" name="password" required>
                    </div>
                    <div class="col-md-4">
                        <label for="sudoPassword" class="form-label">Sudo Password SSH</label>
                        <input type="password" class="form-control" id="sudoPassword" name="sudoPassword">
                    </div>

                    <div class="col-md-12 d-flex align-items-end">
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" id="enabled" name="enabled" checked>
                            <label class="form-check-label" for="enabled">Enabled</label>
                        </div>
                    </div>

                    <div class="col-12 d-flex flex-wrap gap-2 align-items-center">
                        <button type="button" id="testSshConnectionButton" class="btn btn-outline-info">Test
                            Koneksi</button>
                        <button type="submit" id="saveSshConfigButton" class="btn btn-primary">Simpan Config</button>
                        <button type="button" id="cancelSshEditButton" class="btn btn-outline-secondary d-none">Batal Edit</button>
                        <span id="sshConfigMessage" class="small text-muted"></span>
                    </div>
                </form>
            </div>
        </div>

        <div class="card mb-4">
            <div class="card-header">Daftar Konfigurasi SSH</div>
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-striped table-hover align-middle">
                        <thead>
                            <tr>
                                <th>Nama</th>
                                <th>Host</th>
                                <th>Port</th>
                                <th>Username</th>
                                <th>Status</th>
                                <th>Aksi</th>
                            </tr>
                        </thead>
                        <tbody id="sshConfigsTableBody">
                            <tr th:if="${#lists.isEmpty(sshConfigs)}">
                                <td colspan="6" class="text-center text-muted">Belum ada konfigurasi SSH</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <div th:replace="~{fragments/ssh/ssh-delete-modal :: deleteSshConfigModal}"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>
    <script th:inline="javascript">
        /*<![CDATA[*/
        window.serverSshConfigs = /*[[${sshConfigs}]]*/[];
        /*]]>*/
    </script>
    <script src="/js/ssh/ssh-configs.js?v=2" defer></script>
</body>

</html>
