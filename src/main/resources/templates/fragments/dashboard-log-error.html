<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
</head>

<body>
    <div class="col-12">
        <div class="card">
    
            <div class="card-header d-flex justify-content-between align-items-center">
                <span>Log Error</span>
                <div class="d-flex gap-2">
                    <select id="filterProductName" class="form-select form-select-sm" style="width: 150px;">
                        <option value="">Semua Produk</option>
                    </select>
    
                    <input type="text" id="searchLogMessage" class="form-control form-control-sm"
                        placeholder="Cari pesan atau identifier..." style="width: 250px;">
    
                    <button class="btn btn-sm btn-success" type="button" id="btnSearchLog">
                        <i class="bi bi-search"></i> Cari
                    </button>
    
                    <button class="btn btn-sm btn-secondary" type="button" id="btnResetFilter">
                        Reset
                    </button>
                </div>
            </div>
    
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-striped table-hover">
                        <thead>
                            <tr>
                                <th>Product Name</th>
                                <th>Level</th>
                                <th>Log Time</th>
                                <th>Message</th>
                                <th>Identifier</th>
                            </tr>
                        </thead>
                        <tbody id="latestErrorsTableBody">
                            <!-- Data akan dimuat oleh JavaScript -->
                        </tbody>
                    </table>
                </div>
            </div>
    
            <div class="card-footer d-flex justify-content-center align-items-center">
                <nav aria-label="Page navigation">
                    <ul class="pagination pagination-sm mb-0" id="logPagination"></ul>
                </nav>
            </div>
    
        </div>
    </div>
</body>

</html>
