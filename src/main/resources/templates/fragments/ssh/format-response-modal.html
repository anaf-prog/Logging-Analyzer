<!-- Modal Format Response -->
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<body>

    <div th:fragment="formatResponseModal" class="modal fade" id="formatResponseModal" tabindex="-1" aria-labelledby="formatResponseModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="formatResponseModalLabel">
                        <i class="bi bi-file-text"></i> Format Response
                    </h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <div class="mb-3">
                        <label class="form-label fw-bold">Nama Config:</label>
                        <span id="formatResponseName" class="form-control-plaintext"></span>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-bold">Format:</label>
                        <span id="formatResponseType" class="badge bg-primary"></span>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-bold">Template Response:</label>
                        <div class="border rounded p-3 bg-light">
                            <pre id="formatResponseTemplate" class="mb-0" style="max-height: 400px; overflow-y: auto; white-space: pre-wrap; font-family: monospace;"></pre>
                        </div>
                    </div>
                    <div class="d-flex gap-2">
                        <button type="button" class="btn btn-outline-primary" id="copyFormatResponseBtn">
                            <i class="bi bi-clipboard"></i> Salin Template
                        </button>
                        <button type="button" class="btn btn-outline-secondary" id="downloadFormatResponseBtn">
                            <i class="bi bi-download"></i> Download
                        </button>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Tutup</button>
                </div>
            </div>
        </div>
    </div>

</body>

</html>
