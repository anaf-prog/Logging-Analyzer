<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<body>

    <div th:fragment="testResponseModal" class="modal fade" id="testResponseModal" tabindex="-1">
        <div class="modal-dialog modal-lg modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Test Response Template</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div class="mb-3">
                        <label class="form-label">Sample Data (JSON)</label>
                        <textarea id="sampleDataInput" class="form-control" rows="5"
                            placeholder='{"status": "success", "message": "Test message", "data": {"id": 1, "name": "test"}}'></textarea>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Hasil Generated Response</label>
                        <pre id="generatedResponseOutput" class="border p-3 bg-light"
                            style="min-height: 150px; max-height: 400px; overflow: auto;"></pre>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Tutup</button>
                    <button type="button" id="executeTestButton" class="btn btn-primary">Generate Response</button>
                </div>
            </div>
        </div>
    </div>

</body>

</html>
