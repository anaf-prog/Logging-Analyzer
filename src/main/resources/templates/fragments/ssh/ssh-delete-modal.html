<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<body>

    <div th:fragment="deleteSshConfigModal" class="modal fade" id="deleteSshConfigModal" tabindex="-1" aria-labelledby="deleteSshConfigModalLabel"
        aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="deleteSshConfigModalLabel">Hapus Konfigurasi SSH</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <p class="mb-0">Yakin ingin menghapus konfigurasi <strong id="deleteSshConfigName">-</strong>?</p>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Batal</button>
                    <button type="button" id="confirmDeleteSshConfigButton" class="btn btn-danger">Hapus</button>
                </div>
            </div>
        </div>
    </div>

</body>

</html>
