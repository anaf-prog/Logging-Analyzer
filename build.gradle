plugins {
	id 'java'
	id 'org.springframework.boot' version '3.5.11'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.analyze'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
	implementation 'commons-io:commons-io:2.15.1'
	implementation 'com.fasterxml.jackson.dataformat:jackson-dataformat-xml'
	compileOnly 'org.projectlombok:lombok'
	developmentOnly 'org.springframework.boot:spring-boot-devtools'
	runtimeOnly 'org.postgresql:postgresql'
	annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('bootJar') {
	enabled = false
}

def counterFile = file("$rootDir/build-counter.txt")
def buildVersionProvider = providers.provider { 
    project.ext.has("buildVersion") ? project.ext.buildVersion : "UNSET" 
}

tasks.register('updateBuildCounter') {
	// Selalu jalan tiap build biar counter naik
	outputs.upToDateWhen { false }
	doLast {
		def buildDate = new Date().format('yyyyMMdd')
		def buildNumber = 1

		if (counterFile.exists()) {
			def parts = counterFile.text.trim().split('\\s+')
			if (parts.size() == 2 && parts[0] == buildDate) {
				buildNumber = (parts[1] as int) + 1
			}
		}

		def buildVersion = "${buildDate}-${buildNumber}"
		counterFile.text = "${buildDate} ${buildNumber}"
		project.ext.buildVersion = buildVersion
	}
}

tasks.named('jar') {
	dependsOn 'updateBuildCounter'
	enabled = true
	archiveBaseName = 'Logging-Analyze'
	archiveClassifier = ''
	archiveVersion = buildVersionProvider
	inputs.property('buildVersion', buildVersionProvider)

	manifest {
		attributes(
				'Main-Class': 'com.analyze.Application',
				'Class-Path': configurations.runtimeClasspath.files.collect {
					"lib/${it.name}"
				}.join(' ')
		)
	}
}

tasks.named('test') {
	useJUnitPlatform()
}

tasks.register('copyDependencies', Copy) {
	from configurations.runtimeClasspath.filter {
        !it.name.contains('spring-boot-devtools')
    }
	into "$rootDir/install/lib"
}

tasks.register('copyJar', Copy) {
	dependsOn tasks.named('jar')
	from(tasks.named('jar').flatMap { it.archiveFile })
	into "$rootDir/install"
}

tasks.register('copyConfig', Copy) {
	from 'src/main/resources'
	include '**/*.yml', '**/*.properties', '**/*.xml'
	exclude 'META-INF/**'
	exclude 'static/**'
	exclude 'templates/**'
	into "$rootDir/install/config"
}

tasks.register('installApp') {
	dependsOn 'copyDependencies', 'copyJar', 'copyConfig'
}

tasks.register('cleanInstall', Delete) {
	delete "$rootDir/install"
}

tasks.named('clean') {
	dependsOn 'cleanInstall'
}

tasks.named('build') {
	finalizedBy 'installApp'
}
